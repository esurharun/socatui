[package]
name = "socatui"
version = "0.1.1"
edition = "2021"
description = "A task-manager style TUI for running and monitoring multiple socat relays"
license = "MIT"
readme = "README.md"
repository = "https://github.com/esurharun/socatui"
homepage = "https://github.com/esurharun/socatui"
keywords = ["socat", "tui", "ratatui", "proxy", "tunnel"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.80"
exclude = [".github/", "UPDATE.md"]
authors = ["Harun Esur <harun.esur@sceptive.com>"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
nix = { version = "0.29", features = ["signal"] }
anyhow = "1"
shell-words = "1"

[profile.release]
strip = true
lto = true
